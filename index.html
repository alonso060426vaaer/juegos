<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F1E8">
<!-- La pagina nunca se guarda en cache: asi cualquier cambio en los
     juegos llega a la pantalla sin tener que hacer Ctrl+F5. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Zona de Juegos | Joana Bernedo Body Aesthetics</title>
<link rel="icon" href="assets/img/logo.png">
<!-- Manifiesto: permite instalarla como aplicacion, con su icono y su
     ventana propia. display:fullscreen hace que al abrirla desde el
     icono arranque ya sin nada del navegador a la vista. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zona de Juegos">
<link rel="stylesheet" href="assets/css/estilos.css?v=154">
<link rel="stylesheet" href="assets/css/juegos.css?v=127">
</head>
<body>

<div id="app">

  <!-- ====== BARRA SUPERIOR (solo dentro de un juego) ====== -->
  <header id="barra" class="barra" hidden>
    <button class="btn-icono" id="btn-volver" aria-label="Volver al menú">
      <span aria-hidden="true">‹</span>
    </button>
    <div class="barra-centro">
      <h2 id="barra-titulo">Juego</h2>
      <p id="barra-sub"></p>
    </div>
    <div class="intentos" id="intentos" hidden></div>
    <div class="reloj" id="reloj" hidden aria-live="off">
      <span aria-hidden="true">⏱</span><span id="reloj-num">1:30</span>
    </div>
    <button class="btn-icono" id="btn-sonido" aria-label="Activar o desactivar sonido">
      <span aria-hidden="true" id="icono-sonido">♪</span>
    </button>
  </header>

  <!-- ====== ZONA DE PANTALLAS ====== -->
  <main id="pantalla" class="pantalla"></main>

</div>

<!-- ====== MODAL DE RESULTADO ====== -->
<div id="modal" class="modal" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <!-- adorno: ramas doradas en dos esquinas y dos arcos finos -->
    <svg class="modal-adorno" viewBox="0 0 400 600" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-10 170 C 90 150 170 90 210 -10" fill="none" stroke="#C9A96E" stroke-opacity=".55" stroke-width="1.4"/>
      <path d="M410 430 C 330 450 270 520 250 610" fill="none" stroke="#C9A96E" stroke-opacity=".55" stroke-width="1.4"/>
    </svg>
    <svg class="modal-rama modal-rama-a" viewBox="0 0 120 120" aria-hidden="true"><use href="#rama-oro"/></svg>
    <svg class="modal-rama modal-rama-b" viewBox="0 0 120 120" aria-hidden="true"><use href="#rama-oro"/></svg>
    <img class="modal-logo" src="assets/img/logo.png" alt="Joana Bernedo Body Aesthetics">
    <div class="modal-sello" id="modal-sello" hidden>✦</div>
    <h2 id="modal-titulo">¡Muy bien!</h2>
    <p id="modal-mensaje"></p>
    <div id="modal-premio" class="premio" hidden></div>
    <div id="modal-datos" class="modal-datos"></div>
    <div class="modal-botones">
      <button class="btn btn-primario btn-final" id="modal-repetir">Jugar otra vez</button>
    </div>
  </div>
  <!-- la rama dorada, dibujada una vez y usada en las dos esquinas -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="hoja-oro" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#EBD5A6"/><stop offset=".55" stop-color="#C9A262"/><stop offset="1" stop-color="#9C7A42"/>
      </linearGradient>
      <g id="rama-oro">
        <path d="M8 112 C 30 80 52 52 92 14" fill="none" stroke="#B9924F" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M30 82 C 14 70 10 50 16 34 C 32 44 38 64 30 82 Z" fill="url(#hoja-oro)" opacity=".9"/>
        <path d="M30 82 C 46 88 66 84 78 72 C 62 64 42 68 30 82 Z" fill="url(#hoja-oro)" opacity=".75"/>
        <path d="M52 54 C 40 40 40 22 48 8 C 62 22 62 40 52 54 Z" fill="url(#hoja-oro)" opacity=".85"/>
        <path d="M52 54 C 68 58 86 52 96 38 C 80 32 62 38 52 54 Z" fill="url(#hoja-oro)" opacity=".7"/>
        <path d="M74 32 C 72 20 78 8 90 2 C 94 14 88 26 74 32 Z" fill="url(#hoja-oro)" opacity=".8"/>
      </g>
    </defs>
  </svg>
</div>

<!-- ====== PANTALLA COMPLETA ======
     Solo se ve mientras NO lo esta. En cuanto se pulsa desaparece, y vuelve
     a salir si alguien sale con Escape. Asi el personal puede arreglarlo de
     un toque sin tener que tocar el navegador. -->
<button id="btn-pantalla" class="btn-pantalla" hidden
        aria-label="Ver a pantalla completa">
  <span aria-hidden="true">⛶</span> Pantalla completa
</button>

<!-- ====== PROTECTOR DE PANTALLA / ATRACTOR ====== -->
<div id="atractor" class="atractor" hidden>
  <img src="assets/img/logo.png" alt="Joana Bernedo Body Aesthetics" class="atractor-logo">
  <p class="atractor-texto">Toca la pantalla para jugar</p>
  <div class="atractor-brillo"></div>
</div>

<!-- Núcleo: utilidades, navegación, sonido, inactividad -->
<script src="assets/js/nucleo.js?v=155"></script>
<script src="assets/js/premios.js?v=143"></script>
<script src="assets/js/acceso.js?v=149"></script>
<!-- Juegos (cada uno se registra solo en el menú) -->
<script src="assets/js/juegos/memoria.js?v=146"></script>
<script src="assets/js/juegos/trivia.js?v=146"></script>
<script src="assets/js/juegos/mitos.js?v=146"></script>
<script src="assets/js/juegos/palabra.js?v=146"></script>
<script src="assets/js/juegos/ladrillos.js?v=146"></script>
<script src="assets/js/juegos/patos.js?v=146"></script>
<script src="assets/js/juegos/saltos.js?v=146"></script>
<script src="assets/js/juegos/flappy.js?v=146"></script>
<!-- Arranque -->
<script src="assets/js/inicio.js?v=121"></script>

</body>
</html>
