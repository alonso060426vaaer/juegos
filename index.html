<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F1E8">
<title>Zona de Juegos | Joana Bernedo Body Aesthetics</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/estilos.css">
<link rel="stylesheet" href="assets/css/juegos.css">
</head>
<body>

<div id="app">

  <!-- ====== BARRA SUPERIOR (solo dentro de un juego) ====== -->
  <header id="barra" class="barra" hidden>
    <button class="btn-icono" id="btn-volver" aria-label="Volver al menú">
      <span aria-hidden="true">‹</span>
    </button>
    <div class="barra-centro">
      <h2 id="barra-titulo">Juego</h2>
      <p id="barra-sub"></p>
    </div>
    <button class="btn-icono" id="btn-sonido" aria-label="Activar o desactivar sonido">
      <span aria-hidden="true" id="icono-sonido">♪</span>
    </button>
  </header>

  <!-- ====== ZONA DE PANTALLAS ====== -->
  <main id="pantalla" class="pantalla"></main>

</div>

<!-- ====== MODAL DE RESULTADO ====== -->
<div id="modal" class="modal" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-sello" id="modal-sello">✦</div>
    <h2 id="modal-titulo">¡Muy bien!</h2>
    <p id="modal-mensaje"></p>
    <div id="modal-datos" class="modal-datos"></div>
    <div class="modal-botones">
      <button class="btn btn-primario" id="modal-repetir">Jugar otra vez</button>
      <button class="btn btn-suave" id="modal-menu">Ver otros juegos</button>
    </div>
  </div>
</div>

<!-- ====== PROTECTOR DE PANTALLA / ATRACTOR ====== -->
<div id="atractor" class="atractor" hidden>
  <img src="assets/img/logo.png" alt="Joana Bernedo Body Aesthetics" class="atractor-logo">
  <p class="atractor-texto">Toca la pantalla para jugar</p>
  <div class="atractor-brillo"></div>
</div>

<!-- Núcleo: utilidades, navegación, sonido, inactividad -->
<script src="assets/js/nucleo.js"></script>
<!-- Juegos (cada uno se registra solo en el menú) -->
<script src="assets/js/juegos/memoria.js"></script>
<script src="assets/js/juegos/trivia.js"></script>
<script src="assets/js/juegos/mitos.js"></script>
<script src="assets/js/juegos/sopa.js"></script>
<script src="assets/js/juegos/simon.js"></script>
<script src="assets/js/juegos/rutina.js"></script>
<!-- Arranque -->
<script src="assets/js/inicio.js"></script>

</body>
</html>
